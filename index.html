<title>La clé universElle — Site en maintenance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --violet:      #821FA0;
    --violet-dark: #3B1A6B;
    --lilas:       #B86FC8;
    --lilas-clair: #E8D0F0;
    --lilas-pale:  #F5EBF9;
    --blanc:       #FFFFFF;
    --texte:       #1A0A2E;
    --gris:        #3D2B52;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--blanc);
    color: var(--texte);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── MAIN ── */
  .maintenance-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem 2rem;
    background: linear-gradient(160deg, #f8f2fc 0%, #fff 60%);
    text-align: center;
  }

  /* ── LOGO ANIMÉ ── */
  .logo-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    margin-bottom: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Halo pulsé */
  .logo-glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,111,200,0.18) 0%, transparent 70%);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%       { transform: scale(1.12); opacity: 1; }
  }

  .logo-img {
    width: 120px;
    height: auto;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 16px rgba(130,31,160,0.18));
    animation: logoFloat 3s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  /* ── TEXTE ── */
  .maintenance-badge {
    display: inline-block;
    background: var(--lilas-clair);
    color: var(--violet);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.3rem 1rem;
    border-radius: 999px;
    margin-bottom: 1.2rem;
  }

  .maintenance-title {
    font-size: clamp(1.1rem, 3vw, 1.45rem);
    font-weight: 700;
    color: var(--violet-dark);
    line-height: 1.5;
    max-width: 520px;
    margin-bottom: 2.4rem;
  }

  .maintenance-title em {
    font-style: normal;
    color: var(--lilas);
  }

  /* Fade-in au chargement */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.7s ease forwards;
  }
  .fade-in:nth-child(1) { animation-delay: 0.1s; }
  .fade-in:nth-child(2) { animation-delay: 0.25s; }
  .fade-in:nth-child(3) { animation-delay: 0.4s; }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- ── SECTION PRINCIPALE ── -->
<div class="maintenance-main">

  <!-- Logo animé -->
  <div class="logo-wrap fade-in">
    <div class="logo-glow"></div>
    <img src="LOGO_seulpunchy.svg" alt="La clé universElle" class="logo-img">
  </div>

  <!-- Badge -->
  <div class="maintenance-badge fade-in">En cours de création</div>

  <!-- Message principal -->
  <p class="maintenance-title fade-in">
    Le site est en pleine maintenance — je reviens bientôt ouvrir vos portes,<br>
    mais avant ça, je dois réparer mon portail ;)
  </p>

</div>

</body>
</html>
