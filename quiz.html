<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz atelier serrurerie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--violet:#482664;--lilas:#8d68b1;--pale:#f3eef8;--line:#e4dcee;--txt:#2b2b2b;--muted:#6b6b6b;--ok:#1c6b45;--ok-bg:#dcf0e5;--ko:#a3322b;--ko-bg:#f8e1de;--tb:0px}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:#fff;line-height:1.55;padding:0 16px 64px}
.wrap{max-width:44rem;margin:0 auto}
h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:800;color:var(--violet);margin:28px 0 6px;line-height:1.1}
h2{font-size:1.25rem;font-weight:700;color:var(--violet);margin:6px 0 4px}
.lede{color:var(--muted);margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lilas);outline-offset:2px}
.btn{font-weight:600;font-size:.9rem;padding:.5rem 1rem;border-radius:8px;border:1.5px solid var(--violet);background:#fff;color:var(--violet)}
.btn:hover{background:var(--pale)}
.btn.main{background:var(--violet);color:#fff}.btn.main:hover{background:#352049}
.btn[aria-pressed=true]{background:var(--violet);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.box{background:var(--pale);border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.3rem;margin:12px 0}
.box h3{margin:0 0 .5rem;font-size:.95rem;color:var(--violet)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px;margin-top:14px}
.card{text-align:left;background:var(--pale);border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.25rem}
.card:hover:not(:disabled){border-color:var(--violet)}
.card:disabled{opacity:.55;cursor:default}
/*ACCUEIL*/
.tag{font-size:.78rem;font-weight:600;color:var(--lilas)}
.card b{font-size:1.02rem;color:var(--violet)}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;transition:border-color .15s,box-shadow .15s}
.card .tag{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:700}
.card .tag::before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--c);margin-right:.45rem}
.card b{font-size:1.15rem;font-weight:800}
.card:hover:not(:disabled){border-color:var(--violet);border-left-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.k0{--c:#b23a30}.k1{--c:#c4620f}.k2{--c:#a8820a}.k3{--c:#1f6b4a}.k4{--c:#1b6b8a}.k5{--c:#5b3a8c}.k6{--c:#9c2f55}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.band2{height:8px;border-radius:4px;margin:0 0 14px;border:1px solid var(--line);background:linear-gradient(180deg,#5bcefa 0 20%,#f5a9b8 20% 40%,#fff 40% 60%,#f5a9b8 60% 80%,#5bcefa 80% 100%)}
.band{height:6px;border-radius:3px;margin:0 0 4px;background:linear-gradient(90deg,#f28b82,#f6a35c,#e8c23a,#6cc08b,#6aa9e0,#a98bd0,#ef8fbf)}

.card span.d{font-size:.88rem;color:var(--muted)}
#teambar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1.5px solid var(--line);padding:.5rem 0;display:flex;gap:.6rem;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:.35rem;background:var(--pale);border-radius:10px;padding:.3rem .5rem}
.team input{width:7.5rem;border:0;background:transparent;font:inherit;font-weight:600;color:var(--violet)}
.team b{min-width:1.6rem;text-align:center;font-size:1.1rem;font-variant-numeric:tabular-nums}
.team button{width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--violet);background:#fff;color:var(--violet);font-weight:700;line-height:1}
.qbar{position:sticky;top:var(--tb);z-index:10;background:#fff;padding:.5rem 0;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.pins{position:relative;display:flex;align-items:flex-end;gap:6px;height:44px;flex:1 1 160px;min-width:0}
.pins::after{content:"";position:absolute;left:0;right:0;bottom:28px;border-top:2px dashed var(--line)}
.pin{flex:1;max-width:22px;border-radius:3px 3px 0 0;background:var(--line);transition:height .35s ease,background .2s}
.pin.ok{background:var(--ok)}.pin.ko{background:var(--ko)}
.score{font-weight:800;color:var(--violet);white-space:nowrap;line-height:1.2}
.score small{display:block;font-weight:500;font-size:.78rem;color:var(--muted)}
.q{background:var(--pale);border:1.5px solid var(--line);border-radius:16px;padding:1.2rem 1.4rem;margin-top:14px;display:flex;flex-direction:column;gap:.8rem}
.q h3{margin:0;font-size:1.02rem;font-weight:700;color:var(--violet);line-height:1.45}
.q.big{padding:1.6rem}.q.big h3{font-size:clamp(1.3rem,4vw,1.8rem)}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.65rem .8rem;display:flex;gap:.6rem;font-size:.95rem}
.big .opt{font-size:clamp(1.05rem,3vw,1.35rem);padding:.85rem 1rem}
button.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:disabled{cursor:default}
.mk{flex:none;width:1.2em;font-weight:700;color:var(--lilas)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}.opt.right .mk{color:var(--ok)}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko)}.opt.wrong .mk{color:var(--ko)}
.hint{align-self:flex-start;background:none;border:0;padding:0;color:var(--violet);text-decoration:underline;font-size:.88rem}
.note{margin:0;font-size:.88rem;color:var(--muted)}
.fb{margin:0;font-size:.92rem;border-left:3px solid var(--violet);padding-left:.8rem}
.big .fb{font-size:1.05rem}
.fb b.ok{color:var(--ok)}.fb b.ko{color:var(--ko)}
.end{margin-top:18px;background:var(--violet);color:#fff;border-radius:16px;padding:1.2rem 1.4rem}
.end p{margin:0}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:14px;flex-wrap:wrap}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px 14px;margin-top:12px}
.col{display:flex;flex-direction:column;gap:8px}
.m{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;font-size:.9rem}
.m.term{font-weight:700;color:var(--violet)}
.m.sel{border-color:var(--violet);background:var(--pale)}
.m.done{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.m.bad{background:var(--ko-bg);border-color:var(--ko)}
.cylwrap{max-width:36rem;margin:10px auto}
.cyl{display:block;width:100%}
.cyl .plug{fill:#ece3f5;stroke:var(--line);stroke-width:2}
.cyl .stator{fill:var(--pale);stroke:var(--line);stroke-width:2}
.cyl .key{fill:#fff;stroke:var(--violet);stroke-width:2}
.cyl .hole{fill:#fff;stroke:var(--violet);stroke-width:2}
.cyl .kp{fill:#cbb6df}.cyl .dp{fill:#9269b4}
.cyl .spring{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.cyl .sl{stroke:var(--violet);stroke-width:2;stroke-dasharray:6 5}
.cyl.win .sl{stroke:var(--ok);stroke-dasharray:none;stroke-width:3}
.cyl .al .kp{fill:#8fcfae}.cyl .al .dp{fill:#3f8f5c}
.cyl .deep .kp{fill:#efb3ad}.cyl .deep .dp{fill:#c65b48}
.cyl text{font:600 11px Inter,system-ui,sans-serif;fill:var(--violet)}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;margin-left:26.15%;width:55.77%}
.ctl .btn{padding:.35rem .8rem}
.leg{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;justify-content:center;font-size:.82rem;color:var(--muted);margin:10px 0}
.leg i{display:inline-block;width:.9rem;height:.9rem;border-radius:3px;margin-right:.35rem;vertical-align:-2px}
.bonus{margin-top:12px}
.ans{margin:.5rem 0 0;display:none}.ans.show{display:block}
@media (max-width:560px){.match{grid-template-columns:1fr 1.4fr}.q{padding:1.05rem 1rem}}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="teambar" hidden></div>
  <main id="app"></main>
</div>
<script>
(function(){
var FRIEND=[
 {
  "p": "Vous êtes enfermé·e dehors, porte simplement claquée. Le·la serrurier·ère annonce d'emblée qu'il faut percer et changer toute la serrure. Que penser ?",
  "o": [
   "C'est normal, une porte claquée ne s'ouvre jamais autrement",
   "C'est un signal d'alerte : une porte claquée s'ouvre le plus souvent sans casse",
   "C'est obligatoire pour des raisons d'assurance",
   "C'est le signe d'un·e pro bien équipé·e"
  ],
  "c": 1,
  "h": "Pensez à ce qui rapporte le plus à un·e pro malhonnête.",
  "e": "Un·e pro équipé·e tente d'abord une ouverture fine, sans destruction. Le perçage immédiat sert souvent à facturer une serrure neuve au prix fort."
 },
 {
  "p": "Avant une intervention de dépannage à domicile, le·la professionnel·le doit :",
  "o": [
   "Donner un prix à l'oral, cela suffit",
   "Remettre un devis écrit et détaillé avant de commencer les travaux",
   "Faire un devis seulement au-delà de 1 500 €",
   "Envoyer la facture sous 30 jours, sans devis"
  ],
  "c": 1,
  "e": "Pour le dépannage à domicile, un devis écrit détaillé (main-d'œuvre, déplacement, pièces, total TTC) doit être remis avant tout début de travaux. Pas de devis, pas d'intervention."
 },
 {
  "p": "Comment vérifier rapidement qu'une entreprise de serrurerie existe vraiment ?",
  "o": [
   "Elle apparaît en premier dans les résultats sponsorisés",
   "Son autocollant était dans la boîte aux lettres ou le hall de l'immeuble",
   "On vérifie son numéro SIRET sur un annuaire officiel des entreprises",
   "Son numéro commence par 01 ou 05"
  ],
  "c": 2,
  "e": "Le SIRET se vérifie gratuitement en ligne (annuaire des entreprises de l'État, par exemple) : on y voit l'activité, l'adresse et la date de création. Les annonces sponsorisées et les autocollants ne garantissent rien."
 },
 {
  "p": "Quel est le meilleur moment pour choisir son·sa serrurier·ère ?",
  "o": [
   "Le soir de la panne, en appelant le premier numéro trouvé",
   "Avant d'en avoir besoin, en gardant le contact d'un·e artisan·e local·e vérifié·e",
   "Après l'intervention, en comparant les factures",
   "Peu importe, les tarifs sont réglementés"
  ],
  "c": 1,
  "e": "L'urgence est le terrain favori des abus. Repérer à froid un·e artisan·e du quartier (SIRET vérifié, tarifs affichés) évite de choisir sous pression. Les prix sont libres, pas réglementés."
 },
 {
  "p": "Lors d'un dépannage urgent à domicile, le·la pro en profite pour vous faire signer le remplacement de la porte entière. Avez-vous un droit de rétractation ?",
  "o": [
   "Non, jamais pour une intervention urgente",
   "Oui, 14 jours pour tout ce qui dépasse le strict nécessaire à l'urgence",
   "Oui, mais seulement 24 heures",
   "Seulement si rien n'a encore été payé"
  ],
  "c": 1,
  "h": "L'urgence justifie d'ouvrir la porte, pas forcément de la remplacer.",
  "e": "L'exception au droit de rétractation ne couvre que les travaux strictement nécessaires pour répondre à l'urgence. Les prestations et ventes ajoutées sur place restent soumises au délai de 14 jours."
 },
 {
  "p": "Vous estimez avoir été surfacturé·e. Quelle démarche, dans le bon ordre ?",
  "o": [
   "Faire opposition au paiement sans rien dire",
   "Réclamation écrite à l'entreprise, puis médiateur·rice de la consommation et signalement sur SignalConso",
   "Saisir directement le tribunal, c'est le seul recours",
   "Publier un avis négatif et attendre"
  ],
  "c": 1,
  "e": "On commence par une réclamation écrite (recommandé avec accusé de réception), devis et facture à l'appui. Sans réponse satisfaisante : médiation de la consommation, gratuite, et signalement à la DGCCRF via SignalConso. Les associations de consommateur·rices peuvent aider."
 },
 {
  "p": "Dans un cylindre à goupilles, que se passe-t-il quand on insère la bonne clé ?",
  "o": [
   "Un aimant attire le pêne",
   "Les goupilles s'alignent à la bonne hauteur et libèrent la rotation du rotor",
   "La clé pousse directement le pêne hors de la gâche",
   "Un ressort unique se comprime et débloque la porte"
  ],
  "c": 1,
  "e": "Chaque cran de la clé soulève une paire de goupilles à une hauteur précise. Quand toutes les séparations sont alignées sur la ligne de césure, le rotor peut tourner et entraîner le pêne."
 },
 {
  "p": "Que garantit la certification A2P (1, 2 ou 3 étoiles) sur une serrure ?",
  "o": [
   "Que la serrure est fabriquée en France",
   "Un temps de résistance testé face à l'effraction, croissant avec le nombre d'étoiles",
   "Que la serrure est inviolable",
   "La durée de la garantie commerciale"
  ],
  "c": 1,
  "e": "L'A2P atteste d'une résistance testée en laboratoire : environ 5, 10 ou 15 minutes selon le nombre d'étoiles. Aucune serrure n'est inviolable : on gagne du temps, ce qui décourage l'effraction."
 },
 {
  "p": "Quel détail visible depuis le palier signale un point faible sur une serrure standard ?",
  "o": [
   "Un cylindre qui dépasse nettement de la porte, sans protection",
   "Une poignée de couleur dorée",
   "Une clé plate à trous plutôt qu'à dents",
   "La présence d'un judas"
  ],
  "c": 0,
  "h": "Ce qui dépasse donne de la prise.",
  "e": "Un cylindre qui dépasse de plus de quelques millimètres offre une prise et peut être cassé. La parade : un cylindre à la bonne longueur et une rosace ou un protège-cylindre."
 },
 {
  "p": "Quel est l'intérêt d'une serrure multipoints par rapport à une serrure à un seul point ?",
  "o": [
   "Elle se passe de clé",
   "Elle verrouille la porte à plusieurs endroits, ce qui répartit les efforts en cas de tentative de forçage",
   "Elle rend le cylindre inutile",
   "Elle est obligatoire dans tous les logements"
  ],
  "c": 1,
  "e": "Avec 3 ou 5 points d'ancrage (haut, milieu, bas), la porte résiste bien mieux à l'enfoncement ou au pied-de-biche. Mais le cylindre et la solidité de la porte et du bâti comptent tout autant."
 }
];
function vf(p,t,e){return{p:p,o:["Vrai","Faux"],c:t?0:1,e:e}}
function qc(p,o,c,e){return{p:p,o:o,c:o.indexOf(c),e:e}}
var VF=[
 vf("Une porte blindée est totalement incrochetable.",false,"Aucune serrure n'est totalement incrochetable. Le blindage renforce la résistance à l'effraction mais n'offre pas d'inviolabilité."),
 vf("Il faut changer sa serrure après chaque déménagement.",false,"C'est le cylindre qu'on change, pas toute la serrure : nettement moins cher et tout aussi efficace pour récupérer le contrôle des clés. Ce n'est pas une obligation, seulement un conseil. Si vous êtes locataire, gardez le cylindre d'origine pour pouvoir le remettre en place en partant."),
 vf("Un cylindre cher est toujours plus sûr qu'un cylindre bon marché.",false,"Le prix n'est pas un gage de sécurité : le type de cylindre compte. Un cylindre radial est plus sûr qu'un cylindre paracentrique. Mieux vaut vérifier la certification (A2P) que le tarif."),
 vf("Un verrou supplémentaire ralentit toujours un·e cambrioleur·se, même mal posé.",false,"Mal posé, un verrou peut être inutile, voire donner un faux sentiment de sécurité."),
 vf("Votre assurance peut exiger une serrure 3 points (ou plus) certifiée pour vous indemniser après un cambriolage.",true,"Cela dépend du contrat : certains assureurs fixent des exigences sur la serrure (nombre de points, certification). Relisez les conditions de votre contrat."),
 vf("Il est illégal de crocheter sa propre serrure quand on est enfermé·e dehors.",false,"Ouvrir sa propre porte n'est pas illégal. Un·e pro sérieux·se demandera en revanche de justifier que le logement est bien le vôtre."),
 vf("Un bon éclairage extérieur peut contribuer à dissuader un·e cambrioleur·se.",true,"La lumière réduit l'anonymat recherché. Elle complète une bonne serrure sans la remplacer."),
 vf("Une clé « de sécurité » protégée par brevet ne se copie que sur présentation d'une carte de propriété.",true,"Ces clés ne sont reproduites que sur présentation de la carte de propriété, chez le fabricant ou un revendeur agréé."),
 vf("Une serrure connectée (Bluetooth) est toujours plus sûre qu'une serrure mécanique.",false,"Une serrure connectée ajoute du confort mais introduit d'autres risques (piratage, panne électronique) absents d'une serrure mécanique.")
];
var CULT=[
 qc("Depuis quand les serrures à clé existent-elles ?",["Antiquité","Moyen Âge","19e siècle"],"Antiquité","On en trouve déjà dans l'Égypte ancienne, il y a plusieurs milliers d'années."),
 qc("Avant d'ouvrir une porte, un·e serrurier·ère sérieux·se vérifie que vous habitez bien le logement.",["Vrai","Faux"],"Vrai","C'est une bonne pratique professionnelle : on demande une pièce d'identité et un justificatif de domicile pour éviter d'ouvrir un logement à une personne extérieure."),
 qc("Le mot « clé » vient du latin « clavis ».",["Vrai","Faux"],"Vrai","« Clavis » désigne la clé en latin, à l'origine de plusieurs mots français liés à la fermeture."),
 qc("Un·e artisan·e peut-il·elle travailler seul·e en étant micro-entrepreneur·se ?",["Oui","Non"],"Oui","Le statut de micro-entrepreneur·se permet d'exercer seul·e, sans associé·e, avec des démarches administratives allégées."),
 qc("Quelle est la différence entre une clé « à secret » et une clé classique ?",["Elle ne peut pas être reproduite sans autorisation","Elle est plus lourde","Elle ouvre plusieurs serrures"],"Elle ne peut pas être reproduite sans autorisation","Les clés à secret sont protégées par une carte de propriété : seul le fabricant ou un revendeur agréé peut en faire une copie.")
];
var CONSO=FRIEND.slice(0,6).concat([
 {
  "p": "Le devis de dépannage est-il toujours gratuit ?",
  "o": [
   "Oui, la loi interdit de facturer un devis",
   "Non, il peut être payant, mais le·la pro doit l'indiquer avant, avec son coût",
   "Non, il est toujours payant",
   "Oui, sauf si vous refusez de le signer"
  ],
  "c": 1,
  "e": "Le devis est gratuit sauf indication contraire préalable. Le caractère payant ou gratuit doit figurer dans les informations remises avant toute intervention."
 },
 {
  "p": "À partir de quel montant une facture doit-elle vous être remise ?",
  "o": [
   "10 €",
   "100 €",
   "25 €",
   "150 €"
  ],
  "c": 2,
  "e": "Au-delà de ce seuil, la facture est obligatoire une fois la prestation réalisée, et avant le règlement."
 },
 {
  "p": "Le·la pro vous tend le devis à signer une fois les travaux terminés. Que faire ?",
  "o": [
   "Signer : c'est une simple formalité pour la comptabilité",
   "Signer, puis contester sous 14 jours",
   "Signer en ajoutant la mention « sous réserve »",
   "Refuser de signer : le devis doit être remis et accepté avant le début des travaux"
  ],
  "c": 3,
  "e": "Faire signer le devis en même temps que la note à payer est une pratique fréquente. Elle prive de la possibilité de comparer et de refuser."
 },
 {
  "p": "Le prix final dépasse le devis signé. Le·la pro peut-il·elle exiger la différence ?",
  "o": [
   "Oui, le prix final fait foi sur le devis",
   "Oui, si l'intervention a duré plus longtemps que prévu",
   "Non, sauf si vous avez accepté un supplément",
   "Oui, mais seulement la moitié de la différence"
  ],
  "c": 2,
  "e": "Pendant la validité du devis, le prix ne peut pas être augmenté sans l'accord du client. Tout ajout doit faire l'objet d'un accord signé."
 }
]);
var PARC=[
 {t:"Consommateur·rices averti·es",tag:"QCM · "+CONSO.length+" questions",d:"Repérer les abus et connaître ses droits.",items:CONSO},
 {t:"Vrai ou faux : mythes de la sécurité",tag:"Vrai / faux · 9 questions",d:"Démêler le vrai du faux.",items:VF},
 {t:"Découverte technique",tag:"QCM · "+(FRIEND.length-6+CULT.length)+" questions",d:"Cylindre, certification, culture serrurerie.",items:FRIEND.slice(6).concat(CULT)},
 {t:"Bons réflexes au quotidien",tag:"QCM · 5 questions",d:"Clé cassée, clés perdues, entretien : que faire ?",items:[
  qc("Votre clé casse dans la serrure. Quel est le bon réflexe ?",["Forcer avec une pince pour la tourner","Ne pas insister et faire retirer le morceau par un·e pro","Pousser le morceau plus loin avec un tournevis","Verser de la colle pour le ressortir"],"Ne pas insister et faire retirer le morceau par un·e pro","Forcer ou pousser risque d'enfoncer le morceau et d'abîmer le cylindre. Un·e pro a des outils fins pour l'extraire."),
  qc("Que mettre dans une serrure qui se grippe ?",["De l'huile de cuisine","De l'eau savonneuse","Un lubrifiant sec (graphite ou PTFE) fait pour les serrures","Rien : il faut insister"],"Un lubrifiant sec (graphite ou PTFE) fait pour les serrures","Les huiles et graisses attirent la poussière et finissent par encrasser le mécanisme. Un lubrifiant sec, spécial serrure, est plus adapté."),
  qc("Vous avez perdu vos clés sans savoir où. Que faire ?",["Rien, une serrure est inviolable","Changer uniquement la poignée","Attendre de voir si elles reviennent","Faire changer le cylindre"],"Faire changer le cylindre","Si vos clés ont pu tomber entre de mauvaises mains, changer le cylindre est la solution la plus simple pour reprendre le contrôle."),
  qc("Après un cambriolage, que faire en premier ?",["Ne toucher à rien, prévenir la police et son assurance","Tout ranger pour y voir clair","Attendre une semaine avant de réagir","Publier un message sur les réseaux sociaux"],"Ne toucher à rien, prévenir la police et son assurance","Ranger efface des indices. Déclarez aussi le sinistre à l'assurance dans le délai prévu par votre contrat."),
  qc("Où vaut-il mieux éviter de cacher une clé de secours ?",["Chez une personne de confiance","Sous le paillasson ou dans un pot de fleurs","Chez un·e proche qui habite à proximité"],"Sous le paillasson ou dans un pot de fleurs","Ce sont les premières cachettes que l'on vérifie. Mieux vaut confier un double à une personne de confiance.")
 ]}
];
var PAIRS=[
 ["Pêne","Pièce mobile qui sort de la serrure pour s'engager dans la gâche."],
 ["Gâche","Pièce métallique fixée dans le cadre, qui reçoit le pêne."],
 ["Têtière","Plaque visible sur la tranche de la porte, qui recouvre le mécanisme."],
 ["Béquille","Poignée qui actionne le fouillot."],
 ["Fouillot","Pièce interne qui reçoit la béquille."],
 ["Barillet / cylindre","Contient le mécanisme à goupilles actionné par la clé."],
 ["Rosace","Plaque qui entoure le cylindre ou la poignée et protège le perçage."],
 ["Paumelle","Charnière qui relie la porte à son cadre et la fait pivoter."],
 ["Judas","Petite lentille dans la porte pour voir qui est derrière sans ouvrir."],
 ["Entrebâilleur","Chaînette ou butée qui laisse entrouvrir la porte sans l'ouvrir en grand."],
 ["Panneton","Aussi appelé entraîneur : partie du cylindre actionnée par la clé, qui en tournant entraîne le pêne pour verrouiller ou déverrouiller."]
];
var BONUS=[
 {q:"Un petit jeu : double une lettre dans certains mots de serrurerie et tu tombes sur une spécialité italienne. Exemple : pêne → penne. Sauras-tu deviner l'autre ?",a:"Le panettone, le gâteau italien de Noël : un clin d'œil entre vocabulaire technique et gourmandise."},
 {q:"Pourquoi le vélo cargo est-il pratique pour un métier comme celui-ci à Toulouse ?",a:"Zéro émission, zéro bruit, et il passe là où une voiture reste coincée. Le cargo transporte l'outillage nécessaire à domicile."},
 {q:"Combien de clés perdues un·e serrurier·ère fabrique-t-il·elle en moyenne par semaine ?",a:"Zéro, puisqu'elles sont perdues :P"}
];
var REST=[18,40,12,36,22,42,14,38,20],LINE=29;
var S={anim:false,teams:[]};
var app=document.getElementById("app"),tb=document.getElementById("teambar");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el("button","btn"+(cls?" "+cls:""),txt);b.type="button";if(fn)b.addEventListener("click",fn);return b}
function show(fn){app.textContent="";window.scrollTo(0,0);fn()}
function head(title){var d=el("div");d.append(btn("← Accueil","",home),el("h2",null,title));d.firstChild.style.marginBottom="10px";return d}

/* équipes */
function drawTeams(){
  tb.textContent="";tb.hidden=!S.teams.length;
  S.teams.forEach(function(t,k){
    var d=el("div","team"),i=el("input");i.value=t.n;i.setAttribute("aria-label","Nom de l'équipe "+(k+1));
    i.addEventListener("input",function(){t.n=i.value});
    var pts=el("b",null,t.s);
    function chg(v){var b=el("button",null,v>0?"+":"−");b.type="button";b.setAttribute("aria-label",(v>0?"Ajouter":"Retirer")+" un point à "+t.n);b.addEventListener("click",function(){t.s+=v;pts.textContent=t.s});return b}
    d.append(i,chg(-1),pts,chg(1));tb.append(d);
  });
  document.documentElement.style.setProperty("--tb",S.teams.length?tb.offsetHeight+"px":"0px");
}
function setTeams(n){
  var old=S.teams;S.teams=[];
  for(var k=0;k<n;k++)S.teams.push(old[k]||{n:"Équipe "+(k+1),s:0});
  drawTeams();
}

/* accueil */
function home(){show(function(){
  app.append(el("h1",null,"Quiz atelier serrurerie"),el("div","band"),el("div","band2"),el("p","lede","Choisissez un parcours. Chaque bonne réponse aligne une goupille."));
  var o=el("div","box");o.append(el("h3",null,"Options de l'atelier"));
  var r1=el("div","row");
  var ab=btn("Mode animateur : "+(S.anim?"activé":"désactivé"),"",function(){S.anim=!S.anim;home()});ab.setAttribute("aria-pressed",S.anim);
  r1.append(ab,el("span","note","Une question à la fois en grand, avec un bouton « Révéler »."));
  var r2=el("div","row");r2.style.marginTop="10px";r2.append(el("span",null,"Équipes :"));
  [0,2,3,4].forEach(function(n){var b=btn(n?String(n):"Aucune","",function(){setTeams(n);home()});b.setAttribute("aria-pressed",S.teams.length===n);r2.append(b)});
  o.append(r1,r2);app.append(o);
  var g=el("div","cards");
  PARC.forEach(function(p,i){g.append(card(p.tag,p.t,p.d,function(){run(p)},i))});
  g.append(card("Relier · 11 pièces","Relier pièce et définition","Associer chaque pièce de la serrure à son rôle.",match,4));
  g.append(card("Jeu · cylindre","Aligner les goupilles","Réglez chaque colonne jusqu'à la ligne de césure.",cyl,5));
  g.append(card("Discussion","Bonus discussion","Trois questions pour animer le groupe.",bonus,6));
  app.append(g);
})}
function card(tag,t,d,fn,k){var b=el("button","card k"+k);b.type="button";b.append(el("span","tag",tag),el("b",null,t),el("span","d",d));if(fn)b.addEventListener("click",fn);return b}

/* cartes de questions */
function qcard(q,i,big,onpick){
  var c=el("section","q"+(big?" big":"")),h=el("h3");h.append(big?"":(i+1)+". ",q.p);
  var ops=el("div","opts");
  q.o.forEach(function(t,j){
    var b=el(onpick?"button":"div","opt");if(onpick){b.type="button";b.addEventListener("click",function(){onpick(j)})}
    b.append(el("span","mk",String.fromCharCode(65+j)),el("span",null,t));ops.append(b);
  });
  c.append(h,ops);return c;
}
function mark(c,q,j){
  var o=c.querySelectorAll(".opt");
  Array.prototype.forEach.call(o,function(b,k){
    if(b.tagName==="BUTTON")b.disabled=true;
    if(k===q.c){b.classList.add("right");b.firstChild.textContent="✓"}
    else if(k===j){b.classList.add("wrong");b.firstChild.textContent="✗"}
  });
}
function fbk(c,q,ok){
  var f=el("p","fb");
  if(ok!==null)f.append(el("b",ok?"ok":"ko",ok?"Bonne réponse. ":"Pas tout à fait. "));
  f.append(q.e);c.append(f);
}

/* parcours */
function run(P){S.anim?runAnim(P):runNormal(P)}
function runNormal(P){show(function(){
  var ans=P.items.map(function(){return null});
  app.append(head(P.t));
  var bar=el("div","qbar"),pins=el("div","pins"),sc=el("div","score"),rs=btn("Recommencer","",function(){run(P)});
  pins.setAttribute("aria-hidden","true");sc.setAttribute("aria-live","polite");
  P.items.forEach(function(){pins.append(el("div","pin"))});
  bar.append(pins,sc,rs);app.append(bar);
  var end=el("div","end");end.hidden=true;var et=el("p");end.append(et);
  function refresh(){
    var done=0,good=0;
    ans.forEach(function(a,i){if(a!==null){done++;if(a===P.items[i].c)good++}});
    Array.prototype.forEach.call(pins.children,function(p,i){
      var a=ans[i],ok=a!==null&&a===P.items[i].c;
      p.className="pin"+(a===null?"":ok?" ok":" ko");p.style.height=(ok?LINE:REST[i%REST.length])+"px";
    });
    sc.textContent="";sc.append(good+" / "+P.items.length,el("small",null,done+" répondue"+(done>1?"s":"")));
    if(done===P.items.length){
      var m=good===P.items.length?"Toutes les goupilles sont alignées : la serrure tourne.":good>=Math.ceil(P.items.length*.7)?"Bons réflexes. Relisez les explications des questions manquées.":"Reprenez les explications : ce sont les bons réflexes à garder.";
      et.textContent="";et.append(el("b",null,good+" bonnes réponses sur "+P.items.length+". "),m);end.hidden=false;
    }else end.hidden=true;
  }
  P.items.forEach(function(q,i){
    var c=qcard(q,i,false,function(j){
      if(ans[i]!==null)return;ans[i]=j;mark(c,q,j);
      var hb=c.querySelector(".hint"),hn=c.querySelector(".note");if(hb)hb.remove();if(hn)hn.remove();
      fbk(c,q,j===q.c);refresh();
    });
    if(q.h){var hb=el("button","hint","Voir un indice");hb.type="button";var hn=el("p","note","Indice : "+q.h);hn.hidden=true;
      hb.addEventListener("click",function(){hn.hidden=false;hb.hidden=true});c.append(hb,hn)}
    app.append(c);
  });
  app.append(end);refresh();
})}
function runAnim(P){
  var i=0,rev=false;
  function draw(){show(function(){
    var q=P.items[i];app.append(head(P.t));
    app.append(el("p","note","Question "+(i+1)+" sur "+P.items.length));
    var c=qcard(q,i,true,null);app.append(c);
    var nv=el("div","nav");
    nv.append(btn("← Précédente","",function(){if(i>0){i--;rev=false;draw()}}));
    if(!rev){nv.append(btn("Révéler la réponse","main",function(){rev=true;mark(c,q,-1);fbk(c,q,null);nv.replaceWith(nv2())}))}
    else nv.append(nv2());
    function nv2(){var s=el("span");s.append(i<P.items.length-1?btn("Question suivante →","main",function(){i++;rev=false;draw()}):btn("Terminer","main",home));return s}
    app.append(nv);
  })}
  draw();
}

/* relier */
function match(){show(function(){
  app.append(head("Relier pièce et définition"));
  app.append(el("p","lede","Touchez une pièce, puis la définition qui lui correspond."));
  var sel=null,errs=0,done=0;
  var defs=PAIRS.map(function(p,k){return{k:k,d:p[1]}}).sort(function(){return Math.random()-.5});
  var g=el("div","match"),L=el("div","col"),R=el("div","col"),msg=el("p","note");msg.setAttribute("aria-live","polite");
  var lb=PAIRS.map(function(p,k){var b=el("button","m term",p[0]);b.type="button";b.addEventListener("click",function(){
    if(b.classList.contains("done"))return;if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");b.dataset.k=k});b.dataset.k=k;L.append(b);return b});
  defs.forEach(function(x){var b=el("button","m",x.d);b.type="button";b.addEventListener("click",function(){
    if(b.classList.contains("done")||!sel)return;
    if(+sel.dataset.k===x.k){sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;done++;
      if(done===PAIRS.length)msg.textContent=errs?"Terminé avec "+errs+" erreur"+(errs>1?"s":"")+".":"Sans faute : toutes les pièces sont reliées."}
    else{errs++;b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},600)}
  });R.append(b)});
  g.append(L,R);app.append(g,msg,btn("Recommencer","",match));
})}

/* jeu du cylindre */
function cyl(){show(function(){
  app.append(head("Aligner les goupilles"));
  app.append(el("p","lede","Une clé pousse chaque colonne vers le bas, contre un ressort. Appuyez sur ▼ pour enfoncer une colonne : la césure entre la goupille active (claire, côté clé) et la goupille passive (foncée, côté ressort) doit tomber exactement sur la ligne pointillée. Les goupilles actives ont des longueurs différentes : plus elle est courte, plus il faut l'enfoncer. Quand tout est juste, les goupilles passives sont alignées. Trop bas ? Retirez la clé et recommencez."));
  var N=5,SL=140,ST=12,RS=50,DH=80,TIP=12,FL=360,MAX=7,r=[],n=[],L=[],D=[],moves=0;
  var sh=function(a){return a.sort(function(){return Math.random()-.5})},rr=sh([1,2]).concat(sh([3,4,5])),LEN=[0,58,50,34,28,22];
  for(var k=0;k<N;k++){r.push(rr[k]);n.push(0);L.push(LEN[r[k]]);D.push(DH)}
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","-120 0 520 390");svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Coupe d'un cylindre : une clé pousse cinq colonnes de goupilles contre des ressorts.");
  var wrap=el("div","cylwrap"),ctl=el("div","ctl"),msg=el("p","note");
  msg.setAttribute("aria-live","polite");msg.style.textAlign="center";
  function X(k){return 45+k*58}
  function draw(){
    var s='<rect class="plug" x="10" y="8" width="310" height="'+(SL-8)+'" rx="8"/><rect class="stator" x="10" y="'+SL+'" width="310" height="'+(FL+14-SL)+'" rx="8"/>';
    var all=true,deep=false,sp=[],ty=[],te=[];
    for(var k=0;k<N;k++){
      var split=SL-(r[k]-n[k])*ST;sp.push(split);
      ty.push(split-L[k]);te.push(split-L[k]+TIP);
      if(n[k]!==r[k])all=false;if(n[k]>r[k])deep=true;
    }
    var kq=[[14,116]],cl=function(y){return Math.min(138,y)};
    for(var k=0;k<N;k++){
      kq.push([X(k)-16,cl(ty[k]+TIP)],[X(k),ty[k]],[X(k)+16,cl(ty[k]+TIP)]);
    }
    kq.push([306,138]);
    var kd="M-8.6,36 L296,36 L319,76";
    for(var q=kq.length-1;q>=0;q--)kd+=" L"+kq[q][0]+","+kq[q][1];
    s+='<path class="key" d="'+kd+' L-8.6,116 A62 62 0 1 1 -8.6,36 Z"/>';
    s+='<circle class="hole" cx="-78" cy="76" r="14"/>';
    s+='<path d="M0,41 H282 M0,47 H282 M0,53 H282" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>';
    for(var k=0;k<N;k++){
      var split=sp[k],cls=n[k]===r[k]?"al":n[k]>r[k]?"deep":"",y0=split+D[k],pts="";
      for(var j=0;j<=16;j++){pts+=(X(k)+(j===0||j===16?0:(j%2?9:-9)))+","+(y0+(FL-y0)*j/16)+" "}
      s+='<g class="'+cls+'"><polyline class="spring" points="'+pts+'"/><rect class="dp" x="'+(X(k)-16)+'" y="'+split+'" width="32" height="'+D[k]+'" rx="3"/><path class="kp" d="M'+(X(k)-16)+','+split+' L'+(X(k)-16)+','+(split-L[k]+TIP)+' L'+X(k)+','+(split-L[k])+' L'+(X(k)+16)+','+(split-L[k]+TIP)+' L'+(X(k)+16)+','+split+' Z"/></g>';
    }
    s+='<line class="sl" x1="10" x2="320" y1="'+SL+'" y2="'+SL+'"/>';
    s+='<text x="328" y="26">Clé</text><text x="328" y="'+(SL-26)+'">Rotor</text><text x="328" y="'+(SL-2)+'">Ligne de</text><text x="328" y="'+(SL+12)+'">césure</text><text x="328" y="'+(SL+38)+'">Stator</text><text x="328" y="'+(FL-2)+'">Ressorts</text>';
    svg.setAttribute("class","cyl"+(all?" win":""));svg.innerHTML=s;
    msg.textContent=all?"Les 5 séparations sont sur la ligne de césure : le rotor peut tourner, la porte s'ouvre ! ("+moves+" appuis)":deep?"Une goupille est descendue trop bas : retirez la clé pour recommencer. ("+moves+" appuis)":"Appuis : "+moves;
  }
  for(var k=0;k<N;k++)(function(k){
    var b=btn("▼","",function(){if(n[k]>=MAX)return;n[k]++;moves++;draw()});
    b.setAttribute("aria-label","Enfoncer la colonne "+(k+1));ctl.append(b);
  })(k);
  var leg=el("div","leg");
  [["#cbb6df","Goupille active (touche la clé)"],["#9269b4","Goupille passive (poussée par le ressort)"],["","Ressort : repousse vers le haut"]].forEach(function(x){
    var d=el("span"),i=el("i");if(x[0])i.style.background=x[0];else{i.style.border="2px solid var(--muted)";i.style.borderRadius="50%"}
    d.append(i,x[1]);leg.append(d)});
  wrap.append(svg,ctl);
  var rw=el("div","row");rw.style.justifyContent="center";
  rw.append(btn("Retirer la clé (recommencer)","",function(){for(var k=0;k<N;k++)n[k]=0;moves=0;draw()}),btn("Nouveau cylindre","",cyl));
  app.append(wrap,leg,msg,rw);draw();
})}

/* bonus */
function bonus(){show(function(){
  app.append(head("Bonus discussion"));
  BONUS.forEach(function(b){
    var c=el("section","q bonus");c.append(el("h3",null,b.q));
    var a=el("p","fb ans",b.a),r=btn("Révéler la réponse","",function(){a.classList.toggle("show")});
    r.style.alignSelf="flex-start";c.append(r,a);app.append(c);
  });
})}
window.addEventListener("resize",drawTeams);
home();
})();
</script>
